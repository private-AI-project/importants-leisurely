    <form id="pension-reduction-form" class="calc-form">
      <div class="calc-field">
        <label for="birthYear">출생연도</label>
        <input type="number" id="birthYear" name="birthYear" min="1900" max="2010" step="1" placeholder="예: 1966" required>
        <p class="calc-hint">지급개시연령이 출생연도로 갈립니다. 감액이 걸리는 나이도 여기서 정해집니다.</p>
      </div>

      <div class="calc-field">
        <label for="income">월평균 근로·사업소득 <span>(원)</span></label>
        <input type="text" id="income" name="income" inputmode="numeric" placeholder="예: 6000000" required>
        <p class="calc-hint">근로소득과 사업소득만 넣으시면 됩니다. 이자·배당·연금소득은 감액 대상이 아닙니다.</p>
      </div>

      <div class="calc-field">
        <label for="pension">노령연금 월 수령액 <span>(원, 선택)</span></label>
        <input type="text" id="pension" name="pension" inputmode="numeric" placeholder="모르시면 비워두세요">
        <p class="calc-hint">넣으시면 감액 상한(연금의 절반)까지 함께 봅니다. 비워두셔도 진단은 됩니다.</p>
      </div>

      <button type="submit" class="calc-submit">감액 여부 확인하기</button>
    </form>

    <div id="calc-result" class="calc-result" hidden></div>
